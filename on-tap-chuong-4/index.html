<!DOCTYPE html>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<body>
  <main class="app-shell">
    <nav class="topbar" aria-label="Điều hướng chính">
      <button class="brand-btn" data-view="home" aria-label="Về trang chủ">
        <span class="brand-mark">§</span>
        <span>
          <strong>ĐỘC QUYỀN & TƯ BẢN</strong>
          <small>Chapter 4 Quiz Platform</small>
        </span>
      </button>

      <div class="nav-actions">
        <a class="nav-btn" href="../state-monopoly-simulator/game.html">Về Budget Arena</a>

        <button class="nav-btn" data-view="profile">Hồ sơ</button>
